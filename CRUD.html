<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 관리 CRUD</title>
</head>

<style>

</style>

<body>
    <header>
        <h1 id="title"> 영화 관리 프로그램 </h1>
    </header>

    <form id="movie_form">
        <div id="input_area">
            <label for="movie_name">제목</label>
            <input type="text" id="movie_name" placeholder="영화 이름" required>

            <br><label for="movie_director">감독</label>
            <input type="text" id="movie_director" placeholder="감독 이름" required>

            <br><label for="movie_year">개봉년도</label>
            <input type="number" id="movie_year" placeholder="개봉년도" required>

            <br><label for="movie_genre">장르</label>
            <input type="text" id="movie_genre" placeholder="장르 선택 or 입력" list="genre_list" required>

            <datalist id="genre_list">
                <option value="액션"></option>
                <option value="코미디"></option>
                <option value="드라마"></option>
                <option value="공포"></option>
                <option value="SF"></option>
                <option value="판타지"></option>
                <option value="애니메이션"></option>
                <option value="로맨스"></option>
                <option value="스릴러"></option>
                <option value="다큐멘터리"></option>
                <option value="뮤지컬"></option>
                <option value="범죄"></option>
                <option value="전쟁"></option>
                <option value="느와르"></option>
            </datalist>

            <br><label for="movie_rating">평점</label>
            <input type="number" id="movie_rating" placeholder="평점(0.5 ~ 5.0)" min="0.5" max="5" step="0.5" required>

            <br><button type="submit" id="submit_btn">영화 추가</button>
        </div>
    </form>

    <h2> 영화 목록 </h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>감독</th>
                <th>개봉년도</th>
                <th>장르</th>
                <th>평점</th>
                <th>관리</th>
            </tr>
        </thead>

        <tbody id="movie_list"></tbody>
    </table>

    <script>
        let movies = [
            {
                id: 1,
                title: "인셉션",
                director: "크리스토퍼 놀란",
                year: 2010,
                genre: "SF",
                rating: 4.5
            },
            {
                id: 2,
                title: "기생충",
                director: "봉준호",
                year: 2019,
                genre: "드라마",
                rating: 5.0
            },
            {
                id: 3,
                title: "어벤져스: 엔드게임",
                director: "안소니 루소, 조 루소",
                year: 2019,
                genre: "액션",
                rating: 4.0
            }
        ];

        let nextId = 4;
        let editingId = null;

        window.addEventListener("load", function () {

            const form = document.querySelector("#movie_form");
            form.addEventListener("submit", addMovie);
            render();


        });

        function addMovie(event) {
            event.preventDefault();

            const title = document.querySelector("#movie_name").value.trim();
            const director =
                document.querySelector("#movie_director").value.trim();
            const year = parseInt(
                document.querySelector("#movie_year").value
            );
            const genre = document.querySelector("#movie_genre").value.trim();
            const rating = parseFloat(
                document.querySelector("#movie_rating").value
            );

            if (editingId === null) {
                const newMovie = {
                    id: nextId++,
                    title: title,
                    director: director,
                    year: year,
                    genre: genre,
                    rating: rating
                };

                movies.push(newMovie);
            } else {
                const movie = movies.find(function (movie) {
                    return movie.id === editingId;
                });

                movie.title = title;
                movie.director = director;
                movie.year = year;
                movie.genre = genre;
                movie.rating = rating;

                editingId = null;
                document.querySelector("#submit_btn").innerText = "영화 추가";
            }

            render();

            document.querySelector("#movie_form").reset();
            document.querySelector("#movie_name").focus();
        }

        function updateMovie(id) {
            const movie = movies.find(function (movie) {
                return movie.id === id;
            });

            if (!movie) {
                alert("영화를 찾을 수 없습니다.");
                return;
            }

            document.querySelector("#movie_name").value = movie.title;
            document.querySelector("#movie_director").value = movie.director;
            document.querySelector("#movie_year").value = movie.year;
            document.querySelector("#movie_genre").value = movie.genre;
            document.querySelector("#movie_rating").value = movie.rating;

            editingId = id;

            document.querySelector("#submit_btn").innerText = "수정 저장";
            document.querySelector("#movie_name").focus();
        }

        function deleteMovie(id) {
            const confirmed = confirm("정말로 삭제하시겠습니까?");
            if (!confirmed) {
                return;
            }
            movies = movies.filter(function (movie) {
                return movie.id !== id;
            });

            if (editingId === id) {
                editingId = null;
                document.querySelector("#movie_form").reset();
                document.querySelector("#submit_btn").innerText = "영화 추가";
            }
            render();
        }

        function render() {
            const movie_list = document.querySelector("#movie_list");
            movie_list.innerHTML = "";

            movies.forEach(function (movie) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${movie.id}</td>
                    <td>${movie.title}</td>
                    <td>${movie.director}</td>
                    <td>${movie.year}</td>
                    <td>${movie.genre}</td>
                    <td>${movie.rating}</td>
                    <td>
                    <button
                        type="button"
                        onclick="updateMovie(${movie.id})"
                    >
                        수정
                    </button>

                    <button
                        type="button"
                        onclick="deleteMovie(${movie.id})"
                    >
                        삭제
                    </button>
                    </td>
                    `;

                movie_list.appendChild(row);
            })
        }
    </script>


</body>


</html>
